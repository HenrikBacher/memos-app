name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # compileSdk = 37 — make sure the platform and matching build-tools
          # are present even if the runner image doesn't ship them yet.
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          # Only the main branch writes to the remote build cache; PR jobs
          # consume but don't pollute it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run unit tests
        run: ./gradlew :shared:testAndroidHostTest

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: shared/build/reports/tests/testAndroidHostTest
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: release & publish
    # Runs only after a green build (needs: build). Fires on every successful
    # push to main, on version tags, and on manual dispatch — never on PRs.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is required so `git rev-list --count HEAD` produces
          # a stable, monotonically increasing versionCode.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: true

      - name: Resolve version metadata
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Decode Play service account
        env:
          PLAY_SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_SA_JSON" > "$RUNNER_TEMP/play-publisher.json"

      - name: Generate Play Store release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          RELEASE_NOTES_DIR="app/src/main/play/release-notes/en-US"
          mkdir -p "$RELEASE_NOTES_DIR"
          
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREVIOUS_TAG=$(git tag -l 'v*' --sort=-version:refname | sed -n '2p')
          
          if [ -z "$PREVIOUS_TAG" ]; then
            # First release: use all commits
            git log --oneline --format="- %s" > "$RELEASE_NOTES_DIR/default.txt"
          else
            # Generate changelog between tags
            git log "$PREVIOUS_TAG..$CURRENT_TAG" --oneline --format="- %s" > "$RELEASE_NOTES_DIR/default.txt"
          fi
          
          # Trim to Play Store limit (500 chars) if needed
          if [ $(wc -c < "$RELEASE_NOTES_DIR/default.txt") -gt 500 ]; then
            head -c 500 "$RELEASE_NOTES_DIR/default.txt" | head -c $(expr $(head -c 500 "$RELEASE_NOTES_DIR/default.txt" | wc -c) - 1) > "$RELEASE_NOTES_DIR/default.txt.tmp"
            echo "" >> "$RELEASE_NOTES_DIR/default.txt.tmp"
            mv "$RELEASE_NOTES_DIR/default.txt.tmp" "$RELEASE_NOTES_DIR/default.txt"
          fi

      - name: Build release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew :app:bundleRelease -PappVersionCode=${{ steps.version.outputs.code }} -PappVersionName=${{ steps.version.outputs.name }}

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: app-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Publish to Play (internal track, draft)
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_PUBLISHER_CREDENTIALS_PATH: ${{ runner.temp }}/play-publisher.json
        run: |
          ./gradlew \
            :app:publishReleaseBundle \
            :app:publishReleaseListing \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }}

      - name: Wipe Play credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/play-publisher.json"

      - name: Read release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_notes
        run: |
          RELEASE_NOTES=$(cat app/src/main/play/release-notes/en-US/default.txt)
          echo "content<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RELEASE_NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          body: ${{ steps.release_notes.outputs.content }}
